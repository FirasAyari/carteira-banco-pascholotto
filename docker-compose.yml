services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: pascholotto-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "Your_strong_Password123"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q \"SELECT 1\" -C || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 25s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pascholotto-backend
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_URLS: "http://+:8080"
      App__UseHttpsRedirection: "false"
      ConnectionStrings__PascholottoDb: "Server=sqlserver,1433;Database=PascholottoMvp;User Id=sa;Password=Your_strong_Password123;TrustServerCertificate=True;Encrypt=False;"
      Cors__AllowedOrigins__0: "http://localhost:3000"
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pascholotto-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  sqlserver_data:
